name: Daily engineering agent

# Fires every morning. The agent reads the architecture spec, checks the state
# of main, picks the next open Phase 1 story (skipping any that have an open PR
# in flight), cuts a fresh branch, implements the work, runs the full local
# CI gates (fmt + clippy --deny warnings + test --workspace), and opens a
# DRAFT PR for you to review on github.com.
#
# Interaction model: no mid-run approvals. The draft PR IS the approval gate.
# Review it in the morning, mark ready / close / comment like any normal PR.

on:
  schedule:
    # Every 6 hours — 04, 10, 16, 22 UTC. Maps to roughly 23:00 / 05:00 /
    # 11:00 / 17:00 ET (±1h DST). The queue-full pre-flight below keeps
    # this from flooding the review queue: at most N open drafts can
    # coexist, so quadrupling the schedule just means work resumes
    # sooner after you clear a PR.
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    # Lets you kick off a run manually from the Actions tab at any time.
    inputs:
      focus:
        description: 'Optional: force the agent to work on a specific issue number (leave blank to auto-pick)'
        required: false
        type: string
      model:
        description: 'Model: haiku (fast/cheap/default, fits tier-1 TPM) or sonnet (sharp, needs tier 2+)'
        required: false
        type: choice
        default: haiku
        options:
          - haiku
          - sonnet
      max_open_drafts:
        description: 'Skip this run if this many open agent drafts already exist (default 3; set 99 to force)'
        required: false
        type: string
        default: '3'

permissions:
  contents: write       # push the new branch
  pull-requests: write  # open the draft PR
  issues: read          # read the story backlog
  id-token: write       # required by anthropics/claude-code-action@v1
                        # to fetch an OIDC token for GitHub API calls

concurrency:
  group: daily-agent
  cancel-in-progress: false  # never interrupt a run in progress

jobs:
  engineer:
    name: Pick a story and ship a draft PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # Pre-flight: don't flood the review queue. Count the bot's open
      # draft PRs; if it's at or above the cap, skip the run with a
      # clean "notice" annotation so the Actions page shows why.
      # Without this, 4 runs/day × N days of unreviewed work = PR
      # avalanche and a brittle set of interdependent branches.
      #
      # Cap is a workflow_dispatch input (default 3). Set to 99 to
      # force a run regardless.
      - name: Queue-full pre-flight
        id: queue_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          THRESHOLD="${{ github.event.inputs.max_open_drafts || '3' }}"
          OPEN=$(gh pr list --draft --author '@me' --state open --json number -q 'length')
          echo "Open agent draft PRs: $OPEN  (cap: $THRESHOLD)"
          if [ "$OPEN" -ge "$THRESHOLD" ]; then
            echo "::notice::Skipping run — review queue full ($OPEN >= $THRESHOLD open drafts). Clear some PRs, then re-dispatch or wait for the next cron."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust (stable)
        if: steps.queue_check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # System deps needed by the agent's OWN cargo invocations inside
      # its bash loop (the prompt tells it to run cargo fmt/clippy/test
      # locally before pushing). Same trimmed list as `ci.yml` — if you
      # update that list, update this one.
      # alsa-sys (pulled by cpal in crates/ears) needs libasound;
      # reqwest native-tls needs libssl.
      - name: Install system dependencies
        if: steps.queue_check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libssl-dev

      - name: Install Node + pnpm
        if: steps.queue_check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        if: steps.queue_check.outputs.skip != 'true'
        with:
          version: 9

      - name: Cache cargo registry + target
        if: steps.queue_check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Resolve the model: scheduled runs always use Haiku (fits tier-1
      # rate limits, ~10× cheaper per token). Manual workflow_dispatch
      # runs use whatever the user picked (defaults to haiku; can be
      # "sonnet" for a sharper one-off run that actually needs reasoning).
      #
      # The model shortnames map to the currently-recommended pinned
      # versions. Bump these when a newer snapshot is stable.
      - name: Resolve model
        id: model
        if: steps.queue_check.outputs.skip != 'true'
        run: |
          CHOICE="${{ github.event.inputs.model || 'haiku' }}"
          case "$CHOICE" in
            sonnet) RESOLVED="claude-sonnet-4-6" ;;
            haiku|*) RESOLVED="claude-haiku-4-5" ;;
          esac
          echo "resolved=$RESOLVED" >> $GITHUB_OUTPUT
          echo "Agent will run with model: $RESOLVED"

      - name: Run the engineering agent
        id: agent
        if: steps.queue_check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The `prompt` input puts the action in direct/headless mode:
          # there's no issue/comment trigger, no mid-run approvals, and
          # the agent writes + pushes + opens the PR on its own.
          # `claude_args` are forwarded verbatim to the Claude Code CLI.
          claude_args: >-
            --permission-mode acceptEdits
            --allowed-tools Bash,Edit,Read,Write,Grep,Glob,Agent
            --max-turns 200
            --model ${{ steps.model.outputs.resolved }}
          prompt: |
            You are the daily engineering agent for the AI Music Companion ("Musa") codebase.
            The human founder reviews your work every morning as a Draft PR on GitHub.
            Focus on shipping one well-tested, well-reasoned unit of work — not a sprawling mega-PR.

            # Ground rules

            1. **Always cut a fresh branch off `main`.** Never reuse an existing branch.
               Name: `story/<issue-number>-<short-slug>` for feature work,
               `chore/<slug>` for infra, `fix/<slug>` for bug fixes.

            2. **Skip stories that already have an open PR.** Run
               `gh pr list --state open --json headRefName,number,title` and avoid
               any issue whose branch is already taken.

            3. **Honor the dependency graph.** Current Phase 1 build order:
               #14 (free play UI) → #16 (score following) → #17 (practice history)
               → #21 (practice modes). Don't work on a story whose dependencies
               are still open.

            4. **Follow `CLAUDE.md` conventions religiously**:
               - Conventional Commits (`feat:`, `fix:`, `test:`, `docs:`, `chore:`, `refactor:`).
               - NEVER allocate in the `crates/ears` audio thread (no `Box::new`,
                 `Vec::push`, `format!`, `.to_string()`, `.to_owned()` in the hot path).
               - Rust: `cargo clippy --deny warnings` MUST pass.
               - TS: no `any`; strict mode stays on; use Zustand; use Tailwind.
               - Every public item needs a `///` (Rust) or JSDoc (TS) comment.

            5. **Tests must catch real bugs**, per `docs/testing-standards.md`.
               No `assert!(true)`. No `.is_ok()` without checking the inside.
               No string-contains-field-name tests; use serde roundtrips and
               compare actual values. Every error path gets a test.

            # Workflow

            1. `git pull origin main` to make sure you're current.
            2. Read `CLAUDE.md` first (small, ~3KB) for the project rules.
               Only read the larger spec docs when you actually need them for
               the picked story: `docs/architecture/architecture-v2.md`,
               `docs/architecture/README.md`, `docs/testing-standards.md`,
               `docs/design/decisions-log.md`. Don't greedily preload —
               it wastes input tokens.
            3. Optional: if `${{ inputs.focus }}` is set, prioritize that issue.
            4. `gh issue list --state open --label phase-1 --json number,title`
               to see the backlog. Filter out anything with an open PR.
            5. Pick ONE story (or part of one if it's large). State your pick
               and reasoning in a scratchpad before implementing.
            6. Cut a branch. Implement. Add tests.
            7. Locally run:
               - `cargo fmt --all`
               - `cargo clippy --workspace --all-targets -- -D warnings`
               - `cargo test --workspace`
               - `pnpm lint && pnpm test` (if you touched the frontend)
               If any fail, fix them before pushing.
            8. `git push -u origin <branch>` then `gh pr create --draft`.
               PR body should include:
                 - What story / which scope of the story this PR covers.
                 - Architecture notes (why this design).
                 - Test coverage summary.
                 - `Closes #<number>` or `Part of #<number>`.

            # Scope control

            - If a story would produce > 800 lines of diff, split it. Ship the
              smallest coherent slice today and note the follow-up in the PR body.
            - If you hit an ambiguity in the spec, open a GitHub issue titled
              "Spec question: …" and stop. Don't guess.
            - If the test suite or clippy can't be made to pass, DO NOT force-push
              or disable checks. Open a draft PR with the failure clearly flagged
              and a "blocked" label.

            # Reporting

            At the end of your run, output a one-paragraph summary: what you
            picked, why, what the PR does, any risks. This gets captured in the
            Actions run log for the founder's morning review.

      # Why this workflow no longer runs its own cargo/pnpm gates:
      #
      # When the agent pushes a branch and opens the draft PR, GitHub
      # Actions automatically triggers `ci.yml` on that branch. That
      # run IS the gate. Re-running fmt/clippy/test here duplicated
      # the ci.yml logic (apt deps, flags, toolchain setup) and
      # drifted every time ci.yml was updated — the libasound bug
      # that caused three consecutive red runs happened exactly
      # because the two copies disagreed.
      #
      # Single source of truth: ci.yml. The PR's check status tells
      # the morning reviewer whether the agent's code is good.
      # If it's red, the PR is the place to look anyway.
      - name: Summary
        if: always()
        run: |
          echo "### Daily agent run: $(date -u +%Y-%m-%d %H:%M UTC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.queue_check.outputs.skip }}" = "true" ]; then
            echo "**Skipped — review queue at cap.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Clear some open draft PRs (merge, close, or convert to ready), then re-dispatch or wait for the next scheduled run." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "Model: \`${{ steps.model.outputs.resolved }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Open draft PR(s) by this author (may include older drafts — check CI status on each):" >> $GITHUB_STEP_SUMMARY
          gh pr list --draft --author '@me' --state open --json number,title,url \
            -q '.[] | "- #\(.number) \(.title) — \(.url)"' >> $GITHUB_STEP_SUMMARY || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
