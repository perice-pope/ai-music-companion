name: Daily engineering agent

# Fires every morning. The agent reads the architecture spec, checks the state
# of main, picks the next open Phase 1 story (skipping any that have an open PR
# in flight), cuts a fresh branch, implements the work, runs the full local
# CI gates (fmt + clippy --deny warnings + test --workspace), and opens a
# DRAFT PR for you to review on github.com.
#
# Interaction model: no mid-run approvals. The draft PR IS the approval gate.
# Review it in the morning, mark ready / close / comment like any normal PR.

on:
  schedule:
    # Every 6 hours — 04, 10, 16, 22 UTC. Maps to roughly 23:00 / 05:00 /
    # 11:00 / 17:00 ET (±1h DST). The queue-full pre-flight below keeps
    # this from flooding the review queue: at most N open drafts can
    # coexist, so quadrupling the schedule just means work resumes
    # sooner after you clear a PR.
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    # Lets you kick off a run manually from the Actions tab at any time.
    inputs:
      focus:
        description: 'Optional: force the agent to work on a specific issue number (leave blank to auto-pick)'
        required: false
        type: string
      model:
        description: 'Model: haiku (fast/cheap/default, fits tier-1 TPM) or sonnet (sharp, needs tier 2+)'
        required: false
        type: choice
        default: haiku
        options:
          - haiku
          - sonnet
      max_open_drafts:
        description: 'Skip this run if this many open agent drafts already exist (default 3; set 99 to force)'
        required: false
        type: string
        default: '3'

permissions:
  contents: write       # push the new branch
  pull-requests: write  # open the draft PR
  issues: read          # read the story backlog
  id-token: write       # required by anthropics/claude-code-action@v1
                        # to fetch an OIDC token for GitHub API calls

concurrency:
  group: daily-agent
  cancel-in-progress: false  # never interrupt a run in progress

jobs:
  engineer:
    name: Pick a story and ship a draft PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          # Check out with USER_PAT so git operations (push, PR create)
          # run under the founder's identity instead of the default
          # Claude GitHub App installation. Without this, every commit
          # the agent makes shows up as `claude[bot]` in git history
          # and PRs get opened by `app/claude`. With USER_PAT, commits
          # are authored by the founder and PRs attributed to them.
          token: ${{ secrets.USER_PAT }}

      # All `gh` / `git` commands that run inside the agent's bash loop
      # (push, pr create, pr comment, issue create) inherit this identity.
      # Set it BEFORE the claude-code-action runs so the action's
      # internal "Setting git user as claude[bot]" step is preempted.
      # The claude-code-action respects an existing git config rather
      # than forcing its own when a user token is in play.
      - name: Set git identity to founder
        run: |
          git config user.name "Perice Pope"
          git config user.email "42249832+perice-pope@users.noreply.github.com"

      # Pre-flight: don't flood the review queue. Count the bot's open
      # draft PRs; if it's at or above the cap, skip the run with a
      # clean "notice" annotation so the Actions page shows why.
      # Without this, 4 runs/day × N days of unreviewed work = PR
      # avalanche and a brittle set of interdependent branches.
      #
      # Cap is a workflow_dispatch input (default 3). Set to 99 to
      # force a run regardless.
      - name: Queue-full pre-flight
        id: queue_check
        env:
          # Use USER_PAT here too so the "open drafts by @me" query
          # resolves to the founder (USER_PAT's owner) — which is
          # who'll open drafts from now on.
          GH_TOKEN: ${{ secrets.USER_PAT }}
        run: |
          # workflow_dispatch inputs come through as strings, and there's
          # no `type: number` for that trigger (only for workflow_call).
          # So validate and coerce to an integer before the -ge test,
          # otherwise a typo like "three" blows up `test -ge` with
          # "integer expression expected" and turns the run red.
          THRESHOLD_RAW="${{ github.event.inputs.max_open_drafts || '3' }}"
          if [[ "$THRESHOLD_RAW" =~ ^[0-9]+$ ]]; then
            THRESHOLD="$THRESHOLD_RAW"
          else
            echo "::warning::Invalid max_open_drafts='$THRESHOLD_RAW' (must be a non-negative integer). Falling back to 3."
            THRESHOLD=3
          fi
          OPEN=$(gh pr list --draft --author '@me' --state open --json number -q 'length')
          echo "Open agent draft PRs: $OPEN  (cap: $THRESHOLD)"
          if [ "$OPEN" -ge "$THRESHOLD" ]; then
            echo "::notice::Skipping run — review queue full ($OPEN >= $THRESHOLD open drafts). Clear some PRs, then re-dispatch or wait for the next cron."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust (stable)
        if: steps.queue_check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # System deps needed by the agent's OWN cargo invocations inside
      # its bash loop (the prompt tells it to run cargo fmt/clippy/test
      # locally before pushing). Same trimmed list as `ci.yml` — if you
      # update that list, update this one.
      # alsa-sys (pulled by cpal in crates/ears) needs libasound;
      # reqwest native-tls needs libssl.
      - name: Install system dependencies
        if: steps.queue_check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libssl-dev

      - name: Install Node + pnpm
        if: steps.queue_check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        if: steps.queue_check.outputs.skip != 'true'
        with:
          version: 9

      - name: Cache cargo registry + target
        if: steps.queue_check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Resolve the model: scheduled runs always use Haiku (fits tier-1
      # rate limits, ~10× cheaper per token). Manual workflow_dispatch
      # runs use whatever the user picked (defaults to haiku; can be
      # "sonnet" for a sharper one-off run that actually needs reasoning).
      #
      # The model shortnames map to the currently-recommended pinned
      # versions. Bump these when a newer snapshot is stable.
      - name: Resolve model
        id: model
        if: steps.queue_check.outputs.skip != 'true'
        run: |
          CHOICE="${{ github.event.inputs.model || 'haiku' }}"
          case "$CHOICE" in
            sonnet) RESOLVED="claude-sonnet-4-6" ;;
            haiku|*) RESOLVED="claude-haiku-4-5" ;;
          esac
          echo "resolved=$RESOLVED" >> $GITHUB_OUTPUT
          echo "Agent will run with model: $RESOLVED"

      - name: Run the engineering agent
        id: agent
        if: steps.queue_check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the founder's PAT for all GitHub API operations the action
          # performs (PR creation, branch push, comments, issue filing).
          # Without this the action falls back to an OIDC-fetched Claude
          # GitHub App installation token, and every artifact is attributed
          # to `claude[bot]` / `app/claude`. With this, commits and PRs
          # show up as the founder.
          github_token: ${{ secrets.USER_PAT }}
          # Surface the agent's full tool-by-tool reasoning in the Actions
          # log. Default is to hide it, which means when the agent silently
          # exits with zero artifacts (as happened on the 04:53 UTC and
          # 13:15 UTC runs on 2026-04-22), we have no way to diagnose what
          # it decided. This repo has no secrets in docs; the Anthropic API
          # key never appears in agent output. Keep this on until the
          # agent's behavior is reliably observable without it.
          show_full_output: true
          # The `prompt` input puts the action in direct/headless mode:
          # there's no issue/comment trigger, no mid-run approvals, and
          # the agent writes + pushes + opens the PR on its own.
          # `claude_args` are forwarded verbatim to the Claude Code CLI.
          #
          # --permission-mode bypassPermissions is the right mode for
          # headless autonomous runs. `acceptEdits` only auto-approves
          # file edits; any Bash invocation (git push, gh pr create,
          # gh pr comment, cargo test) can still fall through to a
          # permission prompt — and in CI there's no human to answer it,
          # so the SDK counts it as a denial. That's what produced the
          # `permission_denials_count: 1` + zero-artifacts pattern on
          # multiple runs. With bypass, the agent can actually follow
          # through on the workflow the prompt describes.
          claude_args: >-
            --permission-mode bypassPermissions
            --allowed-tools Bash,Edit,Read,Write,Grep,Glob,Agent
            --max-turns 200
            --model ${{ steps.model.outputs.resolved }}
          prompt: |
            You are the midnight developer on this team. The founder just typed
            "continue developing" and went to bed. Ship one thing before morning.

            # Identity

            You work under the founder's git identity. This was configured
            for you before this step ran; do NOT re-set it to `claude[bot]`
            or anything else. If you need to verify, run `git config user.name`
            and `git config user.email`; expected values are "Perice Pope"
            and `42249832+perice-pope@users.noreply.github.com`. If those
            are ever wrong, fix them:

              git config user.name "Perice Pope"
              git config user.email "42249832+perice-pope@users.noreply.github.com"

            NEVER add a `Co-Authored-By: Claude ...` trailer (or any other
            Claude attribution) to commit messages or PR bodies. All work
            is authored by the founder alone. This is non-negotiable.

            # How to pick the next thing

            The source of truth is the spec vs. what's on main. The issue tracker
            is a lossy proxy — read the docs first.

            1. `git pull origin main` — be current.
            2. `cat CLAUDE.md` — house rules.
            3. Read the spec, in order:
               - `docs/architecture/README.md` — roadmap / phase order
               - `docs/architecture/architecture-v2.md` — target system
               - `docs/design/decisions-log.md` — settled calls, don't re-litigate
            4. Scan the active design docs: `ls docs/design/`, then open the
               `story-*.md` for whichever feature is being sliced right now.
            5. `git log main --oneline -30` — what's actually shipped recently.
            6. `gh pr list --state open --json number,headRefName,title` —
               what's in flight. Every branch name here is reserved; don't
               touch those stories.
            7. `gh issue list --label hotspot --state open` — weekly CTO audit
               flags. These ARE worth picking up (spec alone won't tell you
               about rot on main).
            8. If `${{ inputs.focus }}` is set, prioritize that issue.

            # The pick

            The next slice of the spec that:
              (a) main hasn't built yet, AND
              (b) no open PR covers, AND
              (c) has no open question in `decisions-log.md` or the active
                  `story-*.md` design doc.

            If the obvious next slice has an open question → skip it, try the
            next slice down. Don't ask, don't guess. Silence in the decisions
            log means "not decided yet, hands off."

            # Ship it

            1. Fresh branch: `story/<n>-<slug>` for feature work,
               `chore/<slug>` for infra, `fix/<slug>` for bug fixes.
               Check `git ls-remote origin refs/heads/<name>` first — if taken,
               append `-v2`. NEVER reuse a merged branch name.
            2. Before referencing any doc path, `ls` the directory. Don't
               guess paths from memory — the repo layout changes.
            3. Before creating a new file, `ls` its target directory. If a
               file with the same purpose already exists, edit it instead.
            4. Implement. Add tests per `docs/testing-standards.md` — tests
               must check actual values, not just `.is_ok()` or field-name
               string-contains. Every error path gets a test.
            5. Locally run:
               - `cargo fmt --all`
               - `cargo clippy --workspace --all-targets -- -D warnings`
               - `cargo test --workspace`
               - `pnpm lint && pnpm test` (if you touched the frontend)
               All must pass before pushing.
            6. `git push -u origin <branch>` → `gh pr create --draft`.
               PR body: what shipped, why this design, test summary,
               `Part of #<n>` or `Closes #<n>` if it maps to an issue.
            7. One-paragraph summary to stdout AND to `/tmp/agent-summary.md`.
               The Summary step reads that file and surfaces it on the run
               page so the founder can read it on their phone without
               digging through the full log. Write it ALWAYS, including
               on the "nothing tractable" exit path below.

            # Rules

            - Conventional commits (`feat:`, `fix:`, `test:`, `docs:`, `chore:`,
              `refactor:`, `perf:`, `ci:`).
            - NEVER allocate in the `crates/ears` audio thread (no `Box::new`,
              `Vec::push`, `format!`, `.to_string()` in the hot path).
            - TS: no `any`; strict mode stays on; Zustand for state; Tailwind
              for styling.
            - Over 500 lines of diff → split. Ship the smallest meaningful
              slice and note the follow-up in the PR body.
            - If clippy or tests can't be made green, DO NOT disable checks.
              Open the PR anyway with a `blocked` label and a clear note in
              the body.

            # If nothing is tractable

            Spec is fully built, or everything next has an open question, or
            everything clear is already in flight. Don't invent work. Don't
            recreate files that already exist. Exit:

              gh pr comment <oldest-open-draft-pr> \
                --body "daily-agent: nothing clear to pick up — review queue
                is the bottleneck."

            Then write a one-paragraph summary to `/tmp/agent-summary.md`
            explaining WHY — which stories you considered, why you skipped
            each one (open PR? open question? blocked dep?) — so the morning
            reviewer can see the triage rather than just "nothing happened."
            Exit 0.

      # Why this workflow no longer runs its own cargo/pnpm gates:
      #
      # When the agent pushes a branch and opens the draft PR, GitHub
      # Actions automatically triggers `ci.yml` on that branch. That
      # run IS the gate. Re-running fmt/clippy/test here duplicated
      # the ci.yml logic (apt deps, flags, toolchain setup) and
      # drifted every time ci.yml was updated — the libasound bug
      # that caused three consecutive red runs happened exactly
      # because the two copies disagreed.
      #
      # Single source of truth: ci.yml. The PR's check status tells
      # the morning reviewer whether the agent's code is good.
      # If it's red, the PR is the place to look anyway.
      - name: Summary
        if: always()
        run: |
          echo "### Daily agent run: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.queue_check.outputs.skip }}" = "true" ]; then
            echo "**Skipped — review queue at cap.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Clear some open draft PRs (merge, close, or convert to ready), then re-dispatch or wait for the next scheduled run." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "Model: \`${{ steps.model.outputs.resolved }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          # Surface the agent's own one-paragraph summary at the top of
          # the run page. This is what the founder actually reads on their
          # phone over morning coffee — everything below is operational
          # metadata for debugging. The prompt instructs the agent to
          # write this file ALWAYS, including on the "nothing tractable"
          # exit path, so if it's missing that itself is a signal (the
          # agent crashed before it got to the reporting step).
          if [ -f /tmp/agent-summary.md ]; then
            echo "## What the agent did" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat /tmp/agent-summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "## What the agent did" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_No summary file found at \`/tmp/agent-summary.md\` — the agent likely exited before writing one. Check the \"Run the engineering agent\" step above for raw output._" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Open draft PR(s) by this author (may include older drafts — check CI status on each):" >> $GITHUB_STEP_SUMMARY
          gh pr list --draft --author '@me' --state open --json number,title,url \
            -q '.[] | "- #\(.number) \(.title) — \(.url)"' >> $GITHUB_STEP_SUMMARY || true
        env:
          # USER_PAT so `@me` resolves to the founder — which is who the
          # agent now opens drafts as. Using GITHUB_TOKEN here would
          # silently list zero drafts because @me would be the actions
          # bot instead.
          GH_TOKEN: ${{ secrets.USER_PAT }}
