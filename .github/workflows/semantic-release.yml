name: Semantic Release

# Relocated from release.yml (which now drives the Tauri installer build on
# version tags). This job runs semantic-release on every push to main: it reads
# Conventional Commits, computes the next version, updates the changelog, and
# CREATES the `vX.Y.Z` git tag + GitHub Release. That tag push is what triggers
# `release.yml` to build and attach the platform installers. The two workflows
# are complementary: this one decides *when* and *what version*; release.yml
# produces the *artifacts*.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # USER_PAT, not GITHUB_TOKEN, for two load-bearing reasons (both bit us
      # 2026-07-05..07 — every release failed and no installers were built):
      #  1. Branch protection on main blocks the default token's changelog
      #     push; the founder's PAT passes because enforce_admins is off.
      #  2. Tags/releases created with GITHUB_TOKEN do NOT trigger other
      #     workflows (GitHub's anti-recursion rule), so release.yml never
      #     fired and every release since June shipped without installers.
      #     PAT-created tags trigger it normally.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.USER_PAT }}
        run: >
          npx
          -p semantic-release
          -p @semantic-release/git
          -p @semantic-release/changelog
          -p @semantic-release/github
          -p conventional-changelog-conventionalcommits
          semantic-release
