name: Semantic Release

# Relocated from release.yml (which now drives the Tauri installer build on
# version tags). This job runs semantic-release on every push to main: it reads
# Conventional Commits, computes the next version, updates the changelog, and
# CREATES the `vX.Y.Z` git tag + GitHub Release. That tag push is what triggers
# `release.yml` to build and attach the platform installers. The two workflows
# are complementary: this one decides *when* and *what version*; release.yml
# produces the *artifacts*.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # USER_PAT, not GITHUB_TOKEN: branch protection on main blocks the
      # default token's changelog push; the founder's PAT passes because
      # enforce_admins is off. (Every release 2026-07-05..07 failed on this.)
      - name: Record latest release before
        id: before
        env:
          GH_TOKEN: ${{ secrets.USER_PAT }}
        run: echo "tag=$(gh release view --json tagName -q .tagName 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.USER_PAT }}
        run: >
          npx
          -p semantic-release
          -p @semantic-release/git
          -p @semantic-release/changelog
          -p @semantic-release/exec
          -p @semantic-release/github
          -p conventional-changelog-conventionalcommits
          semantic-release

      # The installer build CANNOT ride the tag-push event: the changelog
      # commit semantic-release tags carries "[skip ci]", and GitHub
      # suppresses ALL push-event workflows for refs whose head commit says
      # so — including the v* tag push (proven on v2.15.0: PAT-pushed tag,
      # zero release.yml runs). Dispatch it explicitly at the tag ref;
      # ref_type there is 'tag', so release.yml behaves exactly as a tag
      # push would (attach to the published release + stable-named aliases).
      - name: Fire the installer build for the new release
        env:
          GH_TOKEN: ${{ secrets.USER_PAT }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo none)
          if [ "$TAG" != "${{ steps.before.outputs.tag }}" ] && [ "$TAG" != "none" ]; then
            gh workflow run release.yml --ref "$TAG"
            echo "dispatched installer build for $TAG"
          else
            echo "no new release this run — nothing to build"
          fi
