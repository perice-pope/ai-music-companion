name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation is a waste on fresh CI runners — it adds disk
  # overhead for no reuse benefit. Also cuts target/ cache size noticeably.
  CARGO_INCREMENTAL: 0
  # Strip non-essential debug info from dev builds for faster compile.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Swatinem/rust-cache is purpose-built for Rust: it fingerprints the
      # workspace correctly, trims target/ so the cache stays under GitHub's
      # 10GB limit, and invalidates on rustc/Cargo.lock changes cleanly.
      # Much better hit rate than raw actions/cache for Rust work.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Trim the apt install list aggressively. The original workflow
      # installed 7 packages (12 min cold) for a Tauri desktop build — but
      # this job only runs `cargo test --workspace` against library crates
      # (brain + ears). Tauri deps aren't exercised here.
      #
      # Keep:
      #   - libasound2-dev  — cpal-sys links against libasound for mic capture
      #   - libssl-dev       — reqwest (used by brain::coaching) links native-tls → openssl
      #
      # Drop (Tauri-only, saved ~10 min on cold cache):
      #   libwebkit2gtk-4.1-dev, libappindicator3-dev, librsvg2-dev,
      #   patchelf, libgtk-3-dev
      #
      # When the full Tauri app build lands (Story #14 PR 1+), it'll need
      # its own job with the full dependency list.
      - name: Install system dependencies
        run: |
          # Broken third-party apt mirrors (packages.microsoft.com) failed 5+
          # runs on 2026-07-07; we install nothing from them. Drop before update.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/azure-cli*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libssl-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The `transcribe` crate runs basic-pitch via ONNX Runtime, loaded
      # dynamically at run time (ort `load-dynamic`). The default
      # `download-binaries` backend fetches the runtime from a CDN that our
      # network policy blocks, so we vendor the official Microsoft release here
      # and point ort at it via ORT_DYLIB_PATH. TRANSCRIBE_REQUIRE_ORT=1 makes a
      # missing runtime a hard test failure (no silent skips in CI). The version
      # must match the C API ort 2.0.0-rc.10 targets (ONNX Runtime 1.24.x).
      - name: Vendor ONNX Runtime (transcribe tests)
        run: |
          ORT_VERSION=1.24.2
          curl -fsSL -o /tmp/onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar xzf /tmp/onnxruntime.tgz -C /tmp
          echo "ORT_DYLIB_PATH=/tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"
          echo "TRANSCRIBE_REQUIRE_ORT=1" >> "$GITHUB_ENV"

      - name: Tests
        run: cargo test --workspace --locked

      # Security audit moved to its own weekly workflow (.github/workflows/
      # security-audit.yml). Running it on every PR added 3-5 min of
      # cargo-install overhead for a scan that only changes when an
      # advisory is published. Weekly scheduling matches industry norm
      # and keeps the PR-blocking path lean.

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: apps/desktop
        # --frozen-lockfile with no fallback: if pnpm-lock.yaml drifts from
        # package.json (somebody updated a dep and forgot to commit the lock),
        # CI fails loudly instead of silently regenerating the lock mid-run.
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/desktop
        run: pnpm lint

      - name: Test
        working-directory: apps/desktop
        run: pnpm test

      - name: Build
        working-directory: apps/desktop
        run: pnpm build

  dashboard:
    # #449 T4: the teacher-dashboard web app (apps/dashboard) is a
    # standalone pnpm project like apps/desktop (no root workspace file —
    # see docs/specs/449-t4-dashboard.md §3), so it gets its own lane
    # mirroring the `frontend` job rather than widening that job (whose
    # name is an established required status check). Lockfile-keyed cache,
    # frozen install, then the four gates: lint, format, test, build (tsc
    # runs inside `pnpm build`).
    name: Dashboard checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-dashboard-${{ hashFiles('apps/dashboard/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-dashboard-

      - name: Install dependencies
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/dashboard
        run: pnpm lint

      - name: Format check
        working-directory: apps/dashboard
        run: pnpm format:check

      - name: Test
        working-directory: apps/dashboard
        run: pnpm test

      - name: Build
        working-directory: apps/dashboard
        run: pnpm build

  tauri-rust:
    name: Tauri Rust checks
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Isolate the Tauri crate's cache from the main rust job.
      # This avoids invalidating the workspace cache when Tauri
      # system deps are unavailable, and keeps compile times clean.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      # Tauri on Linux requires GTK and related libraries.
      # Install the full set from the issue #50 recommendation.
      - name: Install system dependencies
        run: |
          # Broken third-party apt mirrors (packages.microsoft.com) failed 5+
          # runs on 2026-07-07; we install nothing from them. Drop before update.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/azure-cli*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev

      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      # The audio-import command transcribes via ONNX Runtime (the `transcribe`
      # crate). Vendor the official runtime so the end-to-end import test runs
      # for real here too; TRANSCRIBE_REQUIRE_ORT=1 makes a missing runtime a
      # hard failure rather than a silent skip. Mirrors the `rust` job.
      - name: Vendor ONNX Runtime (audio import test)
        run: |
          ORT_VERSION=1.24.2
          curl -fsSL -o /tmp/onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar xzf /tmp/onnxruntime.tgz -C /tmp
          echo "ORT_DYLIB_PATH=/tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"
          echo "TRANSCRIBE_REQUIRE_ORT=1" >> "$GITHUB_ENV"

      - name: Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked

  bench:
    name: Latency benchmark
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        # Share the cache key with the rust job so we don't pay
        # compilation twice when the rust job already built everything.
        with:
          shared-key: rust-workspace

      - name: Install system dependencies
        run: |
          # Broken third-party apt mirrors (packages.microsoft.com) failed 5+
          # runs on 2026-07-07; we install nothing from them. Drop before update.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/azure-cli*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libssl-dev

      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 || echo "No benchmarks yet — skipping"
