name: Release (Installers)

# Builds the desktop installers for every platform and uploads them to a DRAFT
# GitHub Release, then waits for a human to review and publish. Triggered by the
# `vX.Y.Z` tags that `semantic-release.yml` pushes (you can also push a tag by
# hand). See docs/release.md for the full runbook and the required secrets.
#
# Signing & notarization are GATED ON SECRETS: if the Apple / Windows / Tauri
# signing secrets are absent the matching steps fall back to producing UNSIGNED
# artifacts so the workflow still completes. Linux deb/AppImage need no signing.

on:
  push:
    tags:
      - "v*"
  # Allow building installers on demand without cutting a release (artifacts
  # land in a draft release named after the chosen ref).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon) + x86_64 universal binary.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal build needs both arch targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      # Linux: GTK / WebKit / AppImage tooling + ALSA (cpal) + SSL (reqwest).
      # Mirrors the tauri-rust job in ci.yml.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          # Broken third-party apt mirrors (packages.microsoft.com) failed 5+
          # runs on 2026-07-07; we install nothing from them. Drop before update.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/azure-cli*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Generate the platform-specific icons (icon.ico for Windows, icon.icns
      # for macOS, plus Square*Logo.png for Windows) from the committed PNG.
      # These are intentionally NOT committed (.gitignore: icons/* keeps only
      # the three base PNGs) and are regenerated deterministically here. Tauri's
      # bundler auto-discovers icons/icon.ico and icons/icon.icns by convention.
      - name: Generate platform icons
        working-directory: apps/desktop
        run: pnpm tauri icon src-tauri/icons/128x128@2x.png

      # The transcribe crate dynamically loads ONNX Runtime; vendor it so the
      # release build links the same runtime CI tests use. (Bundled into the
      # installer via tauri.conf.json `bundle.resources`.)
      - name: Vendor ONNX Runtime (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          ORT_VERSION=1.24.2
          curl -fsSL -o /tmp/onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar xzf /tmp/onnxruntime.tgz -C /tmp
          echo "ORT_DYLIB_PATH=/tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Import Apple code-signing certificate
        # Only runs when the cert secret is present; otherwise macOS builds are
        # produced UNSIGNED (Gatekeeper will warn end users until signed).
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: echo "Apple certificate present — tauri-action will sign & notarize."

      - name: Build & draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Updater signing (Tauri). Without these, installers build but the
          # updater `latest.json` is produced WITHOUT a signature and clients
          # configured with a pubkey will reject the update. ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code signing + notarization (gated: empty == unsigned) ---
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- Windows code signing (gated: empty == unsigned) ---
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # Path to the Tauri app (where tauri.conf.json lives, via the JS CLI).
          projectPath: apps/desktop
          # Reuse the tag that triggered the run; on workflow_dispatch fall back
          # to a ref-derived name.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-manual', github.run_number) }}
          releaseName: "AI Music Companion ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}"
          releaseBody: "See CHANGELOG.md. Installers are attached below."
          # Tag builds attach to the release semantic-release already
          # PUBLISHED (that publish is the human-visible gate — the landing
          # page's /releases/latest/download links must go live without a
          # second manual step). Manual workflow_dispatch builds still land
          # in a draft for review.
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: false
          # The updater manifest (latest.json) is generated and attached when
          # TAURI_SIGNING_PRIVATE_KEY is set.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Stable-named copies for the landing page's "always latest" buttons.
      # `/releases/latest/download/<name>` needs a FILENAME that never
      # changes, but Tauri stamps the version into every bundle
      # ("AI Music Companion_0.1.0_universal.dmg"), so the landing page would
      # need editing on every release. Re-upload the primary installers under
      # fixed names; the version-stamped originals stay attached alongside.
      - name: Upload stable-named installer aliases
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          bundle_root="apps/desktop/src-tauri/target"
          stage="$RUNNER_TEMP/stable-assets"
          mkdir -p "$stage"
          # find, not globstar: the macOS runner's /bin/bash is 3.2.
          alias_first() {
            local f
            f=$(find "$bundle_root" -type f -path "$1" | head -n 1)
            if [ -n "$f" ]; then
              cp "$f" "$stage/$2"
              echo "aliased $(basename "$f") -> $2"
            fi
          }
          case "${{ matrix.platform }}" in
            macos-latest)
              alias_first "*/release/bundle/dmg/*.dmg" "AI-Music-Companion-macOS.dmg"
              ;;
            windows-latest)
              alias_first "*/release/bundle/nsis/*-setup.exe" "AI-Music-Companion-Windows-Setup.exe"
              alias_first "*/release/bundle/msi/*.msi" "AI-Music-Companion-Windows.msi"
              ;;
            ubuntu-latest)
              alias_first "*/release/bundle/appimage/*.AppImage" "AI-Music-Companion-Linux.AppImage"
              alias_first "*/release/bundle/deb/*.deb" "AI-Music-Companion-Linux.deb"
              ;;
          esac
          if [ -z "$(ls -A "$stage")" ]; then
            echo "::error::No bundles found to alias — did the build produce artifacts?"
            exit 1
          fi
          gh release upload "$TAG" "$stage"/* --clobber
