[workspace]
resolver = "2"
members = [
    "crates/ears",
    "crates/brain",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/ai-music-companion"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "macros", "rt"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
roxmltree = "0.20"
midly = "0.5"
