[package]
name = "ears"
description = "Audio capture, pitch detection, and onset detection for the AI Music Companion"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
theory = { path = "../theory" }
ringbuf = "0.4"
cpal = "0.15"
crossbeam-channel = "0.5"
# Spectral-flux (SuperFlux) onset detection needs an FFT. rustfft is the
# pure-Rust FFT the workspace already standardises on (crates/tone, crates/idiom).
rustfft = "6"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "latency"
harness = false
