[package]
name = "brain"
description = "Score following, scoring engine, and practice planner for the AI Music Companion"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only failure-injection seams (#449 T1 review MF3). Enabled solely by
# downstream crates' dev-dependencies (feature unification turns it on for
# `cargo test`, never for a shipping build). Nothing behind it may be used
# outside tests.
test-support = []

[dependencies]
ears = { path = "../ears" }
tone = { path = "../tone" }
theory = { path = "../theory" }
variations = { path = "../variations" }
groove = { path = "../groove" }
idiom = { path = "../idiom" }
ringbuf = "0.4"
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
chrono.workspace = true
dirs.workspace = true
uuid.workspace = true
roxmltree.workspace = true
midly.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile = "3"
criterion.workspace = true

[[bench]]
name = "score_follower_latency"
harness = false

[[bench]]
name = "integrated_analysis"
harness = false
