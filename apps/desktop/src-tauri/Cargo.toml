[package]
name = "ai-music-companion"
version = "2.42.0"
description = "AI Music Companion — your intelligent practice partner"
edition = "2021"

# Keep this package out of the top-level workspace. The workspace hosts
# `crates/ears` and `crates/brain`; this Tauri shell has its own build
# graph (Tauri brings a big tree of dependencies we don't want resolved
# for pure-Rust crate tests).
[workspace]

[lib]
# Split the command surface out of the bin target so unit tests compile
# without triggering `tauri::generate_context!` (which needs the packaged
# icons and a fully-resolved config at compile time).
name = "ai_music_companion"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Tauri v2 auto-updater (desktop). Powers user-initiated update checks against
# the GitHub Releases `latest.json` manifest. Update checks are NOT performed on
# startup — they only run when the frontend explicitly invokes the plugin, so
# the offline-first guarantee (CLAUDE.md) is preserved. Pairs with the JS-side
# `@tauri-apps/plugin-updater`.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
dirs = "5"
ears = { path = "../../../crates/ears" }
brain = { path = "../../../crates/brain" }
transcribe = { path = "../../../crates/transcribe" }
omr = { path = "../../../crates/omr" }
tone = { path = "../../../crates/tone" }
tauri-plugin-process = "2.3.1"
ringbuf = "0.4"

[dev-dependencies]
# `test` feature enables Tauri's mock runtime so command/event behaviour
# (e.g. the `accompaniment-status` payload) can be asserted without a window.
tauri = { version = "2", features = ["test"] }
